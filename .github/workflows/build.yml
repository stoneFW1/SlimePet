name: BuildAPK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check keystore
        id: ks
        run: |
          if [ -f keystore.jks ]; then echo "found=yes" >> $GITHUB_OUTPUT; else echo "found=no" >> $GITHUB_OUTPUT; fi

      - name: Unzip
        run: |
          unzip -o SlimePet.zip -d src
          ls -la src/SlimePet

      - name: Provide keystore
        run: cp keystore.jks src/SlimePet/app/pet.jks

      - name: Dump java sources
        run: |
          D=src/SlimePet/app/src/main/java/com/lin/slimepet
          grep -n "max_tokens" $D/*.java || true
          grep -n "deepseek" $D/*.java || true
          mkdir -p dump && cp -r $D dump/ || true
          git config user.email "pet-bot@users.noreply.github.com"
          git config user.name "pet-bot"
          git add dump && git commit -m "dump java sources [skip ci]" || true
          git push origin HEAD:main || true

      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: src/SlimePet
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src/SlimePet/app/build/outputs/apk/debug/*.apk

      - name: Publish apk to repo
        run: |
          cp src/SlimePet/app/build/outputs/apk/debug/*.apk ./lin-latest.apk || true
          git add lin-latest.apk && git commit -m "publish apk [skip ci]" || true
          git push origin HEAD:main || true
