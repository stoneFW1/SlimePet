name: BuildAPK

on: [push, workflow_dispatch]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Check keystore
        id: ks
        run: |
          if [ -f keystore.jks ]; then echo "found=yes" >> $GITHUB_OUTPUT; else echo "found=no" >> $GITHUB_OUTPUT; fi

      - name: Create fixed keystore
        if: steps.ks.outputs.found == 'no'
        run: |
          keytool -genkeypair -keystore keystore.jks -storetype JKS \
            -storepass linlin123 -keypass linlin123 -alias pet \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Lin,O=SlimePet,C=CN"
          git config user.email "pet-bot@users.noreply.github.com"
          git config user.name "pet-bot"
          git add keystore.jks
          git commit -m "add fixed keystore [skip ci]"
          git push origin HEAD:main || true

      - name: Unzip
        run: |
          ls -la
          unzip -o SlimePet.zip -d src
          ls -la src/SlimePet

      - name: Provide keystore
        run: cp keystore.jks src/SlimePet/app/pet.jks

      - name: SetupGradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: src/SlimePet
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: src/SlimePet/app/build/outputs/apk/debug/*.apk
          - name: Dump and patch AI
  run: |
    D=src/SlimePet/app/src/main/java/com/lin/slimepet
    grep -rn "max_tokens" $D | head -20 || true
    mkdir -p dump && cp -r $D dump/ || true
    git config user.email "bot@users.noreply.github.com"
    git config user.name "pet-bot"
    git add dump && git commit -m "dump java sources [skip ci]" || true
    git push origin HEAD:main || true
